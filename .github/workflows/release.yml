name: release
# On a version tag (vX.Y.Z): a GitHub release with the wheel and source (what the installers download), the container
# image at ghcr.io/witnessory/probe (amd64 and arm64, for Raspberry Pi), and PyPI (trusted publishing: no stored
# password) once the repository variable PYPI_READY is "true". Runs only once the repository is public.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  tests:
    if: ${{ !github.event.repository.private }}
    uses: ./.github/workflows/tests.yml
  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag matches the package version
        run: |
          v=$(python -c "import re;print(re.search(r'VERSION = \"(.+)\"', open('witnessory_probe/__init__.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Install: https://witnessory.org/probe.html"
  pypi:
    needs: build
    if: ${{ vars.PYPI_READY == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/witnessory/probe:${{ github.ref_name }}
            ghcr.io/witnessory/probe:latest
