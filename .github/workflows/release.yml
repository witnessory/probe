name: release
# On a version tag (vX.Y.Z): publish the package to PyPI (trusted publishing: no stored password) and the container
# image to ghcr.io/witnessory/probe (amd64 and arm64, for Raspberry Pi). Runs only once the repository is public.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag matches the package version
        run: |
          v=$(python -c "import re;print(re.search(r'VERSION = \"(.+)\"', open('witnessory_probe/__init__.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/witnessory/probe:${{ github.ref_name }}
            ghcr.io/witnessory/probe:latest
